version: "3.8"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: audit-app-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-fail", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  audit-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: audit-app
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - JINA_API_KEY=${JINA_API_KEY:-}
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - ./reports:/app/reports

volumes:
  qdrant_storage:
