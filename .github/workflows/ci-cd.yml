name: Audit-App CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ============================================================================
  # Continuous Integration (CI): Tests & Audit-App Security Measures (SBOM & CBOM)
  # ============================================================================
  security-audit-and-test:
    name: Security Audit (SBOM & CBOM) & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        run: |
          pytest -v

      - name: Start Qdrant Vector Database
        run: |
          docker run -d -p 6333:6333 -p 6334:6334 --name qdrant qdrant/qdrant:latest
          for i in {1..30}; do
            if curl -s -f http://localhost:6333/readyz >/dev/null 2>&1; then
              echo "✓ Qdrant is online and ready!"
              break
            fi
            sleep 1
          done

      - name: Run Audit-App Security Measures (SBOM & CBOM)
        env:
          QDRANT_URL: "http://localhost:6333"
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          GEMINI_MODEL: "gemini-3.5-flash-lite"
          GOOGLE_EMBEDDING_MODEL: "gemini-embedding-001"
        run: |
          python ci_security_audit.py

      - name: Publish Security Audit Report to GitHub Summary Page
        if: always()
        run: |
          LATEST_REPORT=$(ls -t reports/*.md 2>/dev/null | head -n 1)
          if [ -n "$LATEST_REPORT" ] && [ -f "$LATEST_REPORT" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            cat "$LATEST_REPORT" >> $GITHUB_STEP_SUMMARY
            echo "✓ Appended $LATEST_REPORT directly to GitHub Step Summary"
          fi

  # ============================================================================
  # Continuous Delivery (CD): Build and Push Container Image to GHCR / Docker Hub
  # ============================================================================
  docker-delivery:
    name: Build & Push Container Image
    needs: security-audit-and-test
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Append Delivery Summary to Workflow Summary
        run: |
          echo "### 🚀 Container Image Published Successfully" >> $GITHUB_STEP_SUMMARY
          echo "- **Registry:** \`ghcr.io\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`ghcr.io/${{ github.repository }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Tags:**" >> $GITHUB_STEP_SUMMARY
          for tag in ${{ steps.meta.outputs.tags }}; do
            echo "  - \`$tag\`" >> $GITHUB_STEP_SUMMARY
          done
